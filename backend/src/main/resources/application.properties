spring.application.name=backend

spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USER}
spring.datasource.password=${DATASOURCE_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

frontend.url=${FRONTEND_URL}

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com

# Brevo API Key - Preuzima iz Environment Variables na Renderu
BREVO_API_KEY=${BREVO_API_KEY}
BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Supabase S3
supabase.s3.access-key=${SUPABASE_S3_ACCESS_KEY}
supabase.s3.secret-key=${SUPABASE_S3_SECRET_KEY}
supabase.s3.endpoint=${SUPABASE_S3_ENDPOINT}
supabase.s3.bucket=${SUPABASE_S3_BUCKET:units}
supabase.s3.region=${SUPABASE_S3_REGION:eu-central-1}